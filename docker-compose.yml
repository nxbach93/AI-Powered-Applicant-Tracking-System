services:
  mysql:
    image: mysql:8.0.41
    container_name: ats_mysql_dev
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ats_root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ats_database}
      MYSQL_USER: ${MYSQL_USER:-ats_app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ats_dev_password_change_me}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - ats_mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro

  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: ats_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  core-api:
    build:
      context: ./backend/core-api
      dockerfile: Dockerfile
    container_name: ats_core_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=mysql://${MYSQL_USER:-ats_app_user}:${MYSQL_PASSWORD:-ats_dev_password_change_me}@mysql:3306/${MYSQL_DATABASE:-ats_database}
      - JWT_SECRET=ats-secret-jwt-key-2026-development
      - JWT_EXPIRES_IN=7d
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGIN=http://localhost:3000
      - FRONTEND_URL=http://localhost:3000
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=ntg12072005@gmail.com
      - SMTP_PASS=fcbv lags yczf ilyt
      - SMTP_FROM=AI-Powered ATS <no-reply@ats-system.com>
      - PASSWORD_RESET_TOKEN_EXPIRES_MINUTES=15
    volumes:
      - ats_uploads_data:/app/uploads
    depends_on:
      - mysql
      - ai-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - core-api

volumes:
  ats_mysql_data:
    name: ats_mysql_data
  ats_uploads_data:
    name: ats_uploads_data
